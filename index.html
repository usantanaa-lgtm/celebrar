<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c1d2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Celebrar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Celebrar</title>
<style>
:root{--lit:#2f855a;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --cond: "Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;}
:root{--bg:#f5f6f8;--surface:#ffffff;--surface2:#eceef2;--text:#16191e;--muted:#5f6773;--line:#e1e4e9;--accent:#8c1d2c;--accent-ink:#ffffff;--accent-soft:#f6e6e8;--gold:#a8822f;--rubric:#b3261e;--danger:#b3261e;--refrao:#8c1d2c;--grid:#16191e;--side:#ffffff;color-scheme:light}
@media (prefers-color-scheme: dark){ :root:not([data-theme]){--bg:#111316;--surface:#1a1d21;--surface2:#24282e;--text:#eceef1;--muted:#9aa3ae;--line:#2c3138;--accent:#e0b25c;--accent-ink:#1a1206;--accent-soft:#3a2f1c;--gold:#e0b25c;--rubric:#ef7d72;--danger:#ef7d72;--refrao:#e0b25c;--grid:#eceef1;--side:#15181b;color-scheme:dark}
}
:root[data-theme="claro"]{--bg:#f5f6f8;--surface:#ffffff;--surface2:#eceef2;--text:#16191e;--muted:#5f6773;--line:#e1e4e9;--accent:#8c1d2c;--accent-ink:#ffffff;--accent-soft:#f6e6e8;--gold:#a8822f;--rubric:#b3261e;--danger:#b3261e;--refrao:#8c1d2c;--grid:#16191e;--side:#ffffff;color-scheme:light}
:root[data-theme="escuro"]{--bg:#111316;--surface:#1a1d21;--surface2:#24282e;--text:#eceef1;--muted:#9aa3ae;--line:#2c3138;--accent:#e0b25c;--accent-ink:#1a1206;--accent-soft:#3a2f1c;--gold:#e0b25c;--rubric:#ef7d72;--danger:#ef7d72;--refrao:#e0b25c;--grid:#eceef1;--side:#15181b;color-scheme:dark}
:root[data-theme="pergaminho"]{--bg:#f6f2ea;--surface:#fffdf8;--surface2:#efe8db;--text:#1f1b16;--muted:#6e6457;--line:#e3d9c7;--accent:#8c1d2c;--accent-ink:#ffffff;--accent-soft:#f6e3e2;--gold:#a8822f;--rubric:#b3261e;--danger:#b3261e;--refrao:#8c1d2c;--grid:#1f1b16;--side:#fbf8f2;color-scheme:light}
:root[data-theme="tempo"]{--bg:#f5f6f8;--surface:#ffffff;--surface2:#eceef2;--text:#16191e;--muted:#5f6773;--line:#e1e4e9;--accent:var(--lit);--accent-ink:#ffffff;--accent-soft:color-mix(in srgb,var(--lit) 14%,#fff);--gold:#a8822f;--rubric:#b3261e;--danger:#b3261e;--refrao:var(--lit);--grid:#16191e;--side:#ffffff;color-scheme:light}
:root[data-theme="azul"]{--bg:#f4f6f9;--surface:#ffffff;--surface2:#e9edf3;--text:#111820;--muted:#5d6b78;--line:#dbe1e8;--accent:#1f4fbf;--accent-ink:#ffffff;--accent-soft:#e4ecfb;--gold:#c07a18;--rubric:#c0392b;--danger:#c0392b;--refrao:#1f4fbf;--grid:#111820;--side:#f8fafc;color-scheme:light}
:root[data-theme="palco"]{--bg:#000000;--surface:#0d0d0d;--surface2:#1a1a1a;--text:#ffffff;--muted:#b5b5b5;--line:#2a2a2a;--accent:#ffc94a;--accent-ink:#111111;--accent-soft:#2e260f;--gold:#ffc94a;--rubric:#ff7a6e;--danger:#ff7a6e;--refrao:#ffc94a;--grid:#ffffff;--side:#070707;color-scheme:dark}
:root[data-theme="contraste"]{--bg:#ffffff;--surface:#ffffff;--surface2:#f0f0f0;--text:#000000;--muted:#333333;--line:#000000;--accent:#0033cc;--accent-ink:#ffffff;--accent-soft:#dde6ff;--gold:#8a5a00;--rubric:#b00000;--danger:#b00000;--refrao:#0033cc;--grid:#000000;--side:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
button:active{transform:scale(.97)} button:disabled{opacity:.35}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--danger)} button.on{background:var(--accent-soft);border-color:var(--accent)}
button.mini{min-height:30px;padding:2px 9px;font-size:13px;border-radius:8px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
textarea.mono,.mono{font-family:var(--mono);font-size:13px}
h2{margin:0;font-size:22px} h2 small{font-size:14px;color:var(--muted);font-weight:500}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 110px}
.hint{font-size:13px;color:var(--muted);margin:8px 0}
.sp{flex:1}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-right:5px;vertical-align:-1px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.k{font-family:var(--mono);font-weight:700;font-size:14px;min-width:36px;text-align:right}
.empty{color:var(--muted);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:14px}
.warn{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:14px;margin:10px 0}
.warn span{flex:1}
.notes{background:var(--accent-soft);border-radius:12px;padding:9px 13px;margin:8px 0;white-space:pre-wrap;font-size:15px}
.notes b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}

/* topo e navegação */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center}
.brand{display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px;margin-right:auto;padding:4px}
.brand .dot{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:12px}
.tabs button{border:0;background:transparent;min-height:36px;padding:6px 14px;border-radius:9px}
.tabs button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ib{min-width:40px;padding:6px 8px;font-size:17px}
.bnav{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.bar h2{flex:1} .bar.end{justify-content:flex-end;margin-bottom:0}
.sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 2px 6px}

/* listas */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:60px}
.ev .dt{display:flex;flex-direction:column;align-items:center;min-width:46px;line-height:1.1}
.ev .dt b{font-family:var(--mono);font-size:15px} .ev .dt small{font-size:11px;color:var(--muted);text-transform:uppercase}
.ev .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.ev .tx b,.ev .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ev .tx small{color:var(--muted);font-size:13px}
.ev .n{font-size:13px;color:var(--muted);white-space:nowrap}
.welcome{max-width:520px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.welcome p{color:var(--muted)}

/* evento */
.head{display:flex;gap:8px;align-items:flex-start;margin:12px 0 6px}
.head .ttl{flex:1;min-width:0} .head h1{font-size:22px;margin:0;line-height:1.2}
.head .meta,.meta{font-size:13px;color:var(--muted)} .head .kick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--accent)}
.head .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.back{font-size:24px;min-width:36px;padding:0 6px;line-height:1}
.litstrip{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:2px 0}
.litstrip span{flex:1}
.salmo{font-size:13px;color:var(--muted);margin:2px 0 6px} .salmo:empty{display:none}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:4px 0 6px}
.bh{display:flex;gap:6px;align-items:center;padding:6px 12px 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--accent)}
.bh .bn{min-height:34px;padding:4px 8px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:600;flex:1}
.row{display:flex;gap:6px;align-items:center;padding:2px 8px 2px 4px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.cur{background:var(--accent-soft)}
.row .ti{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:8px;display:flex;flex-direction:column}
.row .ti b,.row .ti small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .row .ti small{font-size:13px;color:var(--muted)}
.row .ti em{color:var(--accent);font-style:normal}
.ksel{width:auto;min-height:36px;padding:4px 6px;font-family:var(--mono);font-weight:800;min-width:64px}
.ksel.big{min-height:42px;font-size:18px;min-width:84px}
.addrow{position:relative;padding:0 8px}
.adder{min-height:34px;border:0;background:transparent;font-size:14px;padding:4px 8px;color:var(--text)}
.adder::placeholder{color:var(--muted);opacity:.8}
.adder:focus{outline:none;background:var(--surface2)}
.blk .row+.addrow,.blk .addrow{border-top:1px solid var(--line)}
.sugg{position:absolute;left:10px;right:10px;top:calc(100% - 2px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.sugg:empty{display:none}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface)}
.pick span{display:flex;flex-direction:column;min-width:0} .pick small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.new{color:var(--accent);font-weight:600}
.modal .pick{border:1px solid var(--line);border-radius:10px;margin:5px 0}

/* tablet: lista + música lado a lado */
.split{display:grid;grid-template-columns:minmax(330px,40%) 1fr;gap:16px;align-items:start}
.pane-list{position:sticky;top:60px;max-height:calc(100vh - 66px);overflow:auto;padding-right:4px;padding-bottom:20px}
.pane-song{position:sticky;top:60px;max-height:calc(100vh - 66px);overflow:auto;padding-bottom:30px}

/* música */
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.keynote{font-size:13px;color:var(--muted);margin:8px 2px}
.nogrid{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);margin-top:10px}
.trecho{font-size:18px;color:var(--text);margin-bottom:6px;font-style:italic}
.navbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:14px 0;font-size:14px;color:var(--muted)}
.fontbar{display:flex;gap:6px;justify-content:flex-end;margin:6px 0}
.sheet{--fs:18px}
.gsec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 12px 12px}
.gsec.refrao{border-left-color:var(--refrao)}
.gname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px}
.gsec.refrao .gname{color:var(--refrao)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:12px}
.cell{border-left:2px solid var(--grid);padding:2px 4px 2px 8px;min-height:calc(var(--fs)*2.3);display:flex;align-items:center;font-family:var(--cond);font-size:calc(var(--fs)*1.5);line-height:1;white-space:nowrap;overflow:hidden}
.cell:nth-child(4n),.cell:last-child{border-right:2px solid var(--grid)}
.cr{display:flex;gap:.4em;align-items:baseline} .cell.c2 .cr{font-size:.8em} .cell.c3 .cr{font-size:.62em;gap:.3em}
.gc{font-weight:700;letter-spacing:-.02em;color:var(--text)} .gc sup{font-size:.55em;font-weight:600;margin-left:1px;vertical-align:.55em} .gc .gb{font-size:.6em;font-weight:600}

/* liturgia */
.dsel{width:auto}
.litcard{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.lcbar{width:8px;border-radius:6px;background:var(--lc);flex:none;border:1px solid rgba(0,0,0,.15)}
.litcard h2{margin:2px 0 8px;font-size:21px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.leit{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.leit summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline}
.leit summary::-webkit-details-marker{display:none}
.leit summary b{flex:1} .leit summary span{font-family:var(--mono);font-size:13px;color:var(--accent)}
.leit .body{padding:0 14px 14px;white-space:pre-wrap;line-height:1.6;font-size:var(--fs,17px)}
.leit .body i{display:block;color:var(--muted);font-style:normal;font-size:.9em;margin-bottom:6px}
.refrao-box{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-weight:600}

/* acervo */
.addlink{display:flex;gap:8px;margin:0 0 8px}
.search{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:999px;padding:5px 12px;min-height:34px;font-size:14px}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 12px}
.srow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .k{flex:none;min-width:44px;padding-right:4px}
.srow b,.srow small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .srow small{font-size:13px;color:var(--muted)}

/* formulários e modais */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--text);font-size:16px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:34px;padding:4px 12px;border-radius:8px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;max-width:640px;max-height:90vh;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.modal h3{margin:0 0 10px}
.fres{display:flex;gap:6px;align-items:center} .fres .pick{flex:1;min-width:0}
@media (min-width:700px){ .modal{align-items:center} .modal .box{border-radius:18px} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}


/* grade: extras */
.gname{display:flex;gap:8px;align-items:center} .gname span{flex:1}
.gref{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;margin:8px 0}
.cell{cursor:pointer;flex-direction:column;align-items:flex-start;justify-content:center}
.cell:active{background:var(--accent-soft)}
.bfig{display:block;margin-top:3px;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--accent)}
.gb.sug{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opts button{display:flex;flex-direction:column;align-items:center;min-width:72px;font-family:var(--cond);font-size:19px;line-height:1.1}
.opts button small{font-family:var(--sans);font-size:11px;color:var(--muted)}
.inl{display:inline-flex;gap:4px;align-items:center} .inl select{width:auto;min-height:30px;padding:2px 6px;font-size:13px}
/* cifra com letra */
.csec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 12px 10px}
.csec.refrao{border-left-color:var(--refrao)}
.csec pre{margin:0;font-family:var(--mono);font-size:calc(var(--fs)*.9);line-height:1.35;white-space:pre;overflow-x:auto}
.ch{color:var(--accent);font-weight:700} .nz{color:var(--muted)} .tabl{color:var(--muted);font-size:.85em}
/* importar */
.seg.wide{display:flex;margin:10px 0} .seg.wide button{flex:1}
.impbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.impopt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.impopt span{color:var(--muted)}
.form.imp{margin-top:10px}
.lrow{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.lrow input[type=checkbox]{width:20px;min-height:20px;flex:none}
.lrow input{min-height:34px;padding:4px 8px;font-size:14px} .lrow .lt{flex:2} .lrow .la{flex:1.4} .lrow .lk{width:56px;flex:none;font-family:var(--mono)}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.slist.done .srow{font-size:14px}
@media (max-width:640px){ .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .impbox{grid-template-columns:1fr} .lrow{flex-wrap:wrap} .lrow .lt{flex:1 1 70%} }


/* ===== shell com barra lateral ===== */
.serif,h1,h2,.litcard h2{font-family:var(--serif);font-weight:600;letter-spacing:.1px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
body.scol .shell{grid-template-columns:62px 1fr}
.mainc{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:12px 10px 16px;display:flex;flex-direction:column;gap:2px}
.sbrand{display:flex;gap:10px;align-items:center;font-family:var(--serif);font-size:21px;font-weight:700;padding:4px 6px 10px}
.sbrand .dot,.brand .dot{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;flex:none}
.slit{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.slit .sw{flex:none}
.si{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;border-radius:9px;padding:8px 10px;min-height:40px;text-align:left;color:var(--text);font-size:15px}
.si .ic{width:22px;text-align:center;font-size:16px;flex:none}
.si:hover{background:var(--surface2)}
.si.on{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}

<script>
/* ===== Teoria / cifras ===== */
const NOTES_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const KEYS_MAJ=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const KEYS_MIN=['Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m','Am','Bbm','Bm'];
const FLAT_KEYS=new Set(['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm']);

const QUAL_RE=/^(?:maj|min|dim|aug|sus|add|m|M|º|°|\+|-|\d+|\(|\)|#|b|\/\d+|,)*$/;
function splitChord(c){
  const m=c.match(/^([A-G])([#b]?)(.*)$/); if(!m) return null;
  let q=m[3], bass=null; const i=q.lastIndexOf('/');

function isChord(c){ return !!splitChord(c); }
function noteName(i,flats){ i=((i%12)+12)%12; return (flats?NOTES_F:NOTES_S)[i]; }
function transposeChord(c,semi,flats){
  if(!semi) return c; const p=splitChord(c); if(!p) return c;

function bassOf(c,semi,flats){ const p=splitChord(c); if(!p) return c; const n=p.bass||p.root; return semi?noteName(IDX[n]+semi,flats):n; }

const NOISE_RE=/^(?:x?\d+x?|%|-+|\/+|\|+|\.+|:)$/i;

function parseBarLine(l){

function gridCells(sec){

/* ----- Sugestão de inversões (linha de baixo) ----- */
function chordTones(c){
  const p=splitChord(c); if(!p) return null; const q=p.q;
  const dim=/^(dim|º|°)/.test(q)||/m7\(b5\)|m7b5/.test(q);
  const minor=dim||/^m(?!aj)/.test(q);
  const third=/sus2/.test(q)?2:/sus/.test(q)?5:minor?3:4;
  const fifth=dim?6:(/aug|^\+$|\(#5\)/.test(q)?8:7);
  let sev=null; if(/7M|maj7|7\+/.test(q)) sev=11; else if(/(º|°|dim)7/.test(q)) sev=9; else if(/7/.test(q)) sev=10;
  const opts=[{iv:0,b:0},{iv:third,b:1},{iv:fifth,b:3}]; if(sev!==null) opts.push({iv:sev,b:2});
  return {p,r:IDX[p.root],opts};
}
const BASS_MOVE=[0.5,0,0,2,3,2,4];
function pcDist(a,b){ const d=(b-a+12)%12; return Math.min(d,12-d); }
function degKey(c,keyIdx){ const p=splitChord(c); if(!p) return null; const iv=(IDX[p.root]-keyIdx+12)%12; return ROMAN[iv]+(/^m(?!aj)/.test(p.q)?'m':'')+(/7/.test(p.q)?'7':''); }
function learnBass(chords,keyIdx){
  const memo=db.prefs.invMemo||(db.prefs.invMemo={});
  for(const c of chords){ const p=splitChord(c); if(!p) continue; const k=degKey(c,keyIdx); const iv=p.bass?(IDX[p.bass]-IDX[p.root]+12)%12:0; const m=memo[k]||(memo[k]={}); m[iv]=(m[iv]||0)+1; }
}
function suggestInversions(chords,flats,keyIdx){
  const it=chords.map(c=>chordTones(c)); const idx=it.map((x,i)=>x?i:-1).filter(i=>i>=0); const n=idx.length;
  const out=chords.slice(); if(n<2) return out;
  const memo=db.prefs.invMemo||{};
  const cands=idx.map((i,k)=>{ const t=it[i]; if(t.p.bass) return [{pc:IDX[t.p.bass],cost:0,keep:true}];
    const mk=keyIdx!=null?memo[degKey(chords[i],keyIdx)]:null;
    let o=t.opts; if(!mk&&(k===0||k===n-1)) o=[t.opts[0]];
    return o.map(x=>{ let cost=x.b; if(mk){ const tot=Object.values(mk).reduce((a,b)=>a+b,0); const f=(mk[x.iv]||0)/tot; cost=cost-3*f+(f===0?1:0); } return {pc:(t.r+x.iv)%12,cost,root:x.iv===0}; }); });
  const best=[cands[0].map(c=>({v:c.cost,prev:-1}))];
  for(let k=1;k<n;k++){ best.push(cands[k].map(c=>{ let bv=1e9,bp=0; cands[k-1].forEach((pc,j)=>{ const v=best[k-1][j].v+BASS_MOVE[pcDist(pc.pc,c.pc)]; if(v<bv){bv=v;bp=j;} }); return {v:bv+c.cost,prev:bp}; })); }
  let j=0; best[n-1].forEach((x,i)=>{ if(x.v<best[n-1][j].v) j=i; });
  for(let k=n-1;k>=0;k--){ const c=cands[k][j], i=idx[k]; if(!c.keep&&!c.root) out[i]=chords[i]+'/'+noteName(c.pc,flats); j=best[k][j].prev; }
  return out;
}
function rebuildChordLine(l,queue){
  let out='',len=0; const re=/\S+/g; let m;
  while((m=re.exec(l))){ const p=m.index; if(len<p){ out+=' '.repeat(p-len); len=p; } else if(len>0){ out+=' '; len++; }
    const t=m[0], c=coreOf(t); let txt=t; if(c[2]&&isChord(c[2])&&queue.length){ const nx=queue.shift(); if(nx===''){ continue; } txt=c[1]+nx+c[3]; } out+=txt; len+=txt.length; }
  return out;
}
function applySectionChords(text,secIndex,newChords){
  const lines=(text||'').split('\n'); const raw=[]; let cur=null;
  lines.forEach((l,i)=>{ const hd=l.match(/^\s*\[([^\]]+)\]\s*$/); if(hd){ cur={name:hd[1],idx:[]}; raw.push(cur); return; } if(!cur){ cur={name:'',idx:[]}; raw.push(cur); } cur.idx.push(i); });
  const vis=raw.filter(s=>s.name||s.idx.some(i=>lines[i].trim()));
  const sec=vis[secIndex]; if(!sec) return text;
  const q=newChords.slice();
  for(const i of sec.idx){ if(classify(lines[i])==='chord') lines[i]=rebuildChordLine(lines[i],q); }
  return lines.join('\n');
}
function replaceCell(src,secIndex,cellIndex,newChords){
  const sec=sections(src)[secIndex]; if(!sec) return src; const cells=gridCells(sec);
  const flat=[]; cells.forEach((cs,ci)=>cs.forEach(c=>{ if(c!=='%') flat.push({c,ci}); }));
  const pos=flat.findIndex(x=>x.ci===cellIndex); if(pos<0) return src;
  const count=flat.filter(x=>x.ci===cellIndex).length;
  const q=flat.map(x=>x.c); q.splice(pos,count,newChords.join(' '),...Array(count-1).fill(''));
  return applySectionChords(src,secIndex,q);
}
function transposeNotes(txt,semi,flats){ if(!semi) return txt; return String(txt).replace(/\b([A-G])([#b]?)(?![a-z])/g,(m,l,a)=>{ const i=IDX[l+a]; return i===undefined?m:noteName(i+semi,flats); }); }
function bassFigKey(useGrid,si,ci){ return (useGrid?'g':'t')+':'+si+':'+ci; }
function invApplies(sec){ const pref=db.prefs.inv||''; if(!pref) return false; if(pref==='all') return true; const n=norm(sec.name); return n.includes('refr')||n.includes('coro'); }

/* ===================== Importar do iReal Pro ===================== */
function irObf(s){ const n=s.split(''); for(let i=0;i<5;i++){ n[49-i]=s[i]; n[i]=s[49-i]; } for(let i=10;i<24;i++){ n[49-i]=s[i]; n[i]=s[49-i]; } return n.join(''); }
function irUnscramble(s){ let r='',p=s; while(p.length>50){ const a=p.slice(0,50); p=p.slice(50); if(p.length<2) r+=a; else r+=irObf(a); } return r+p; }
const IR_SEC={A:'Parte A',B:'Parte B',C:'Parte C',D:'Parte D',i:'Intro',v:'Verso',V:'Verso',c:'Refrão',b:'Ponte',o:'Final'};
function irQual(q){
  q=(q||'').replace(/\*/g,'');
  q=q.replace(/^-/, 'm').replace(/\^7?/,'7M').replace(/^h7?/,'m7(b5)').replace(/^o7?/, m=>m==='o7'?'º7':'º');
  return q;
}
function irMusicToText(music){
  const re=/<([^>]*)>|XyQ|Kcl|LZ|T\d\d|N\d|\*([A-Za-z])|([A-GW][b#]?)((?:\*[^*]*\*)|(?:sus|add|alt|maj|dim|[-^hoø+mM]|\d+|[b#](?=\d))*)(\/[A-G][b#]?)?|(\{|\}|\[|\]|\||Z)|(x)|(n)|(\([^)]*\))|([\s,]+)|(.)/g;
  const secs=[]; let cur={name:'',items:[]}; secs.push(cur);
  const hasBars=/[|\[\]{}Z]/.test(music.replace(/<[^>]*>/g,''));
  let meas=[]; let unknown=0;
  const flush=()=>{ if(meas.length){ cur.items.push(meas.join(' ')); meas=[]; } };
  const newSec=n=>{ flush(); if(!cur.items.length&&!cur.name){ cur.name=n; return; } cur={name:n,items:[]}; secs.push(cur); };
  let m;
  while((m=re.exec(music))){
    if(m[1]!==undefined){ const t=m[1].trim(); if(t) newSec(t.length>48?t.slice(0,46)+'…':t); }
    else if(m[2]){ newSec(IR_SEC[m[2]]||('Parte '+m[2])); }
    else if(m[3]){ if(m[3]==='W'){ continue; } const ch=m[3]+irQual(m[4])+(m[5]||''); if(hasBars) meas.push(ch); else cur.items.push(ch); }
    else if(m[6]){ if(hasBars) flush(); }
    else if(m[7]||m[0]==='Kcl'){ if(hasBars){ flush(); cur.items.push('%'); } else cur.items.push('%'); }
    else if(m[0].startsWith('XyQ')||m[0]==='LZ'||/^T\d\d$/.test(m[0])||/^N\d/.test(m[0])||m[8]||m[9]||m[10]){ if(m[0]==='LZ'&&hasBars) flush(); }
    else if(m[11]){ if(!/[sSlQfYUpr]/.test(m[11])) unknown++; }
  }
  flush();
  const out=[];
  let n=0;
  const notes=[];
  for(const s of secs){ if(!s.items.length){ if(s.name) notes.push(s.name); continue; } n++;
    out.push('['+(s.name||('Parte '+n))+']');
    for(let i=0;i<s.items.length;i+=4) out.push('| '+s.items.slice(i,i+4).join(' | ')+' |');
    out.push('');
  }
  return {text:out.join('\n').trim(),unknown,notes};
}
function irParse(src){
  const m=src.match(/irealb?:\/\/[^"<>\s]+/); if(!m) return [];
  let raw=m[0].replace(/^irealb?:\/\//,''); try{ raw=decodeURIComponent(raw); }catch(e){}
  const songs=[];
  for(const part of raw.split('===')){
    const f=part.split('='); const i=f.findIndex(x=>x.startsWith('1r34LbKcu7')); if(i<1) continue;
    const music=irUnscramble(f[i].slice(10));
    const key=(f[4]||'').replace(/-$/,'m');
    const r=irMusicToText(music);
    songs.push({title:f[0].trim(),artist:(f[1]||'').trim(),style:f[3]||'',key,text:r.text,unknown:r.unknown,notes:r.notes});
  }
  return songs;
}

const COR={verde:'#2f855a',roxo:'#6b46c1',branco:'#efe8d6',vermelho:'#c53030',rosa:'#d6669b'};
const DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const FIXAS={'01-01':'Santa Maria, Mãe de Deus','02-02':'Apresentação do Senhor','03-19':'São José','03-25':'Anunciação do Senhor','06-24':'Natividade de São João Batista','06-29':'São Pedro e São Paulo','08-06':'Transfiguração do Senhor','08-15':'Assunção de Nossa Senhora','09-14':'Exaltação da Santa Cruz','10-12':'Nossa Senhora Aparecida, Padroeira do Brasil','11-01':'Todos os Santos','11-02':'Fiéis Defuntos (Finados)','12-08':'Imaculada Conceição de Nossa Senhora','12-25':'Natal do Senhor'};
const TRANSFERIVEIS=new Set(['06-29','08-15','11-01']);
function dUTC(y,m,d){ return new Date(Date.UTC(y,m-1,d)); }
function addD(dt,n){ return new Date(dt.getTime()+n*864e5); }
function isoOf(dt){ return dt.toISOString().slice(0,10); }
function parseIso(iso){ const [y,m,d]=iso.split('-').map(Number); return dUTC(y,m,d); }
function isoAdd(iso,n){ return isoOf(addD(parseIso(iso),n)); }
function nextSunday(iso){ const d=parseIso(iso); return isoOf(addD(d,(7-d.getUTCDay())%7)); }
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return dUTC(y,mo,da); }
function advent1(y){ const x=dUTC(y,12,25), w=x.getUTCDay(); return addD(addD(x,-(w===0?7:w)),-21); }
function litInfo(iso){
  const d=parseIso(iso), Y=d.getUTCFullYear(), dow=d.getUTCDay(), sun=dow===0, md=iso.slice(5);
  const days=(a,b)=>Math.round((a-b)/864e5), same=(a,b)=>a.getTime()===b.getTime();
  const adv=advent1(Y), ly=d>=adv?Y+1:Y;
  const ciclo=['C','A','B'][ly%3], par=ly%2===0?'par (II)':'ímpar (I)';
  const E=easter(Y), ash=addD(E,-46), palm=addD(E,-7), pent=addD(E,49), xmas=dUTC(Y,12,25);
  const jan2=dUTC(Y,1,2), ep=addD(jan2,(7-jan2.getUTCDay())%7), bapt=ep.getUTCDate()>=7?addD(ep,1):addD(ep,7);
  let tempo,cor,titulo='',semana='';
  const ord=n=>n+'º';
  if(d>=adv&&d<xmas){
    tempo='Advento'; cor='roxo'; const w=Math.floor(days(d,adv)/7)+1; semana=w+'ª semana do Advento';
    if(sun){ titulo=ord(w)+' Domingo do Advento'; if(w===3) cor='rosa'; }
  } else if(d>=xmas||d<=bapt){
    tempo='Natal'; cor='branco';
    const inOct = d>=xmas || (d.getUTCMonth()===0&&d.getUTCDate()===1);
    semana=inOct?'Oitava do Natal':'Tempo do Natal';
    if(md==='12-25') titulo='Natal do Senhor';
    else if(md==='01-01') titulo='Santa Maria, Mãe de Deus';
    else if(same(d,ep)) titulo='Epifania do Senhor';
    else if(same(d,bapt)) titulo='Batismo do Senhor';
    else if(d.getUTCMonth()===11){ let sf=null; for(let k=26;k<=31;k++){ const t=dUTC(Y,12,k); if(t.getUTCDay()===0){ sf=t; break; } } if(!sf) sf=dUTC(Y,12,30); if(same(d,sf)) titulo='Sagrada Família de Jesus, Maria e José'; }
    else if(sun) titulo='Domingo do Tempo do Natal';
  } else if(d<ash){
    tempo='Tempo Comum'; cor='verde'; const bs=addD(bapt,-bapt.getUTCDay()); const w=Math.floor(days(d,bs)/7)+1;
    semana=w+'ª semana do Tempo Comum'; if(sun) titulo=ord(w)+' Domingo do Tempo Comum';
  } else if(d<palm){
    tempo='Quaresma'; cor='roxo'; const l1=addD(E,-42);
    if(d<l1){ semana='Depois das Cinzas'; if(same(d,ash)) titulo='Quarta-feira de Cinzas'; }
    else { const w=Math.floor(days(d,l1)/7)+1; semana=w+'ª semana da Quaresma'; if(sun){ titulo=ord(w)+' Domingo da Quaresma'; if(w===4) cor='rosa'; } }
  } else if(d<E){
    tempo='Semana Santa'; cor='roxo'; const k=days(d,palm);
    titulo=['Domingo de Ramos e da Paixão do Senhor','Segunda-feira Santa','Terça-feira Santa','Quarta-feira Santa','Quinta-feira Santa (Ceia do Senhor à noite)','Sexta-feira da Paixão do Senhor','Sábado Santo (Vigília Pascal à noite)'][k];
    semana='Semana Santa'; if(k===0||k===5) cor='vermelho'; if(k===4) cor='branco';
  } else if(d<=pent){
    tempo='Páscoa'; cor='branco'; const w=Math.floor(days(d,E)/7)+1; semana=days(d,E)<8?'Oitava da Páscoa':w+'ª semana da Páscoa';
    if(sun) titulo=w===1?'Domingo da Páscoa — Ressurreição do Senhor':w===7?'Ascensão do Senhor':ord(w)+' Domingo da Páscoa';
    if(same(d,pent)){ titulo='Domingo de Pentecostes'; cor='vermelho'; tempo='Pentecostes'; }
  } else {
    tempo='Tempo Comum'; cor='verde'; const ck=addD(adv,-7); const so=addD(d,-dow); const w=34-Math.round(days(ck,so)/7);
    semana=w+'ª semana do Tempo Comum'; if(sun) titulo=ord(w)+' Domingo do Tempo Comum';
    if(same(d,addD(pent,7))){ titulo='Santíssima Trindade'; cor='branco'; }
    else if(same(d,addD(pent,11))){ titulo='Santíssimo Corpo e Sangue de Cristo (Corpus Christi)'; cor='branco'; }
    else if(same(d,addD(pent,19))){ titulo='Sagrado Coração de Jesus'; cor='branco'; }
    else if(same(d,ck)){ titulo='Nosso Senhor Jesus Cristo, Rei do Universo'; cor='branco'; }
  }
  if(FIXAS[md]&&tempo!=='Semana Santa'&&!(dow===0&&/Domingo d[oa] (Advento|Quaresma)/.test(titulo))){ cor=({'06-29':'vermelho','09-14':'vermelho','11-02':'roxo'})[md]||'branco'; }
  let festa=FIXAS[md]||''; if(festa&&festa===titulo) festa='';
  return {tempo,cor,ciclo,par,titulo,semana,festa,transf:TRANSFERIVEIS.has(md),dow};
}

/* ===================== Leituras (dentro do app) ===================== */
const LEIT_API='https://liturgia.up.railway.app/v2/';
const LEIT_KEY='celebrar_leituras';
let leitCache={}; try{ leitCache=JSON.parse(localStorage.getItem(LEIT_KEY)||'{}')||{}; }catch(e){ leitCache={}; }
const leitState={}; let prefetched=false;
function saveLeit(){ const ks=Object.keys(leitCache).sort(); while(ks.length>60) delete leitCache[ks.shift()]; try{ localStorage.setItem(LEIT_KEY,JSON.stringify(leitCache)); }catch(e){} }
async function fetchJson(url){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),12000); try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(t); } }
function apiIso(s){ const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }
async function loadLeituras(iso,force){
  if(!iso||(!force&&(leitCache[iso]||leitState[iso]==='loading'||leitState[iso]==='erro'))) return;
  leitState[iso]='loading'; refreshLeit(iso);
  const [y,m,d]=iso.split('-');
  try{
    const j=await fetchJson(`${LEIT_API}?dia=${d}&mes=${m}&ano=${y}`);
    const it=Array.isArray(j)?j[0]:j; if(!it||!it.leituras) throw new Error('vazio');
    leitCache[iso]={...it,_at:Date.now()}; saveLeit(); leitState[iso]='ok';
  }catch(e){ leitState[iso]='erro'; }
  refreshLeit(iso);
}
async function prefetchWeek(){
  if(prefetched||!navigator.onLine) return; prefetched=true;
  const t=today(); let miss=false; for(let i=0;i<7;i++) if(!leitCache[isoAdd(t,i)]) miss=true;
  if(!miss) return;
  try{ const j=await fetchJson(LEIT_API+'?periodo=7'); (Array.isArray(j)?j:[j]).forEach(it=>{ const iso=apiIso(it&&it.data); if(iso&&it.leituras&&!leitCache[iso]) leitCache[iso]={...it,_at:Date.now()}; }); saveLeit(); }catch(e){}
}
function refreshLeit(iso){ document.querySelectorAll('[data-leit="'+iso+'"]').forEach(el=>{ el.innerHTML=leiturasHtml(iso); }); document.querySelectorAll('[data-salmo="'+iso+'"]').forEach(el=>{ el.innerHTML=salmoHtml(iso); }); }
function leitBlock(label,arr,isSalmo){
  if(!Array.isArray(arr)||!arr.length) return '';
  return arr.map((x,i)=>`<details class="leit"><summary><b>${esc(label)}${arr.length>1?' (opção '+(i+1)+')':''}</b><span>${esc(x.referencia||'')}</span></summary><div class="body">${isSalmo&&x.refrao?`<div class="refrao-box">R. ${esc(x.refrao)}</div>`:''}${x.titulo?`<i>${esc(x.titulo)}</i>`:''}${esc(x.texto||'')}</div></details>`).join('');
}
function leiturasHtml(iso){
  const L=leitCache[iso], st=leitState[iso];
  if(!L){
    if(st==='erro') return `<div class="warn"><span style="flex:1">Não consegui carregar as leituras deste dia (sem internet ou serviço fora do ar). Quando abrir com internet, elas ficam guardadas para usar offline.</span><button data-act="leitRetry" data-d="${iso}">Tentar de novo</button></div>`;
    return `<div class="hint">Carregando leituras…</div>`;
  }
  const l=L.leituras||{}, o=L.oracoes||{}, a=L.antifonas||{};
  const ora=[['Antífona de entrada',a.entrada],['Oração do dia (coleta)',o.coleta],['Sobre as oferendas',o.oferendas],['Antífona da comunhão',a.comunhao],['Depois da comunhão',o.comunhao]].filter(x=>x[1]);
  return `${L.liturgia?`<div class="hint" style="margin:4px 2px 8px"><b>${esc(L.liturgia)}</b>${L.cor?' · '+esc(L.cor):''}</div>`:''}
    ${leitBlock('1ª Leitura',l.primeiraLeitura)}${leitBlock('Salmo',l.salmo,true)}${leitBlock('2ª Leitura',l.segundaLeitura)}${leitBlock('Evangelho',l.evangelho)}
    ${(l.extras||[]).map(x=>leitBlock(x.tipo||x.titulo||'Leitura',[x])).join('')}
    ${ora.length?`<details class="leit"><summary><b>Antífonas e orações</b><span></span></summary><div class="body">${ora.map(([t,v])=>`<i>${esc(t)}</i>${esc(v)}\n\n`).join('')}</div></details>`:''}
    <div class="hint">Fonte: serviço comunitário de liturgia diária (não oficial). Guardado neste aparelho para uso offline.</div>`;
}

/* ===================== Organização automática (importar) ===================== */
const HEAD_RE=/^\s*(intro(?:du[çc][aã]o)?|refr[aã]o|coro|verso\s*\d*|ponte|final|solo|interl[uú]dio|pr[eé][\s-]?refr[aã]o|(?:primeira|segunda|terceira|quarta|quinta|1ª|2ª|3ª|4ª)\s+parte|parte\s*\d+)\s*(?:[:\-–]\s*(.*))?$/i;
function cap(s){ s=s.trim().replace(/\s+/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); }
function guessKey(txt){
  for(const l of txt.split('\n')){
    if(classify(l)!=='chord') continue;
    for(const t of l.trim().split(/\s+/)){ const c=coreOf(t)[2]; const p=c&&splitChord(c); if(p) return p.root+(/^m(?!aj)/.test(p.q)?'m':''); }
  }
  return null;
}
function autoSections(txt){
  const blocks=txt.split(/\n[ ]*\n/).map(b=>b.split('\n')).filter(b=>b.some(l=>l.trim()));
  const sig=b=>b.filter(l=>classify(l)==='lyric').map(l=>l.trim().toLowerCase().replace(/[^\p{L}\s]/gu,'').replace(/\s+/g,' ')).join(' ');
  const counts={}; blocks.forEach(b=>{ const s=sig(b); if(s) counts[s]=(counts[s]||0)+1; });
  let n=0;
  const names=blocks.map((b,i)=>{
    const s=sig(b);
    if(!s) return i===0?'Intro':(i===blocks.length-1?'Final':'Instrumental');
    if(counts[s]>1) return 'Refrão';
    n++; return 'Parte '+n;
  });
  return blocks.map((b,i)=>'['+names[i]+']\n'+b.join('\n')).join('\n\n');
}
function organize(raw){
  const meta={key:null,capo:null};
  const lines=String(raw||'').replace(/\r/g,'').replace(/\t/g,'    ').replace(/ /g,' ').split('\n').map(l=>l.replace(/\s+$/,''));
  const out=[]; let hasHead=false;
  for(const l of lines){
    let m;
    if((m=l.match(/^\s*tom\s*:\s*([A-Ga-g][#b]?m?)/i))){ meta.key=m[1].charAt(0).toUpperCase()+m[1].slice(1); continue; }
    if(/^\s*capotraste/i.test(l)){ meta.capo=l.trim(); continue; }
    if(/^\s*(afina[çc][aã]o|composi[çc][aã]o|cifra\s*:|colabora[çc][aã]o)/i.test(l)) continue;
    if((m=l.match(/^\s*\[([^\]]+)\]\s*(.*)$/))){ hasHead=true; out.push('['+cap(m[1])+']'); if(m[2].trim()) out.push(m[2].trim()); continue; }
    if((m=l.match(HEAD_RE))){ hasHead=true; out.push('['+cap(m[1])+']'); if(m[2]&&m[2].trim()) out.push(m[2].trim()); continue; }
    out.push(l);
  }
  let txt=out.join('\n').replace(/\n[ ]*\n([ ]*\n)+/g,'\n\n').replace(/^\s*\n/,'').replace(/\s+$/,'');
  if(!hasHead&&txt.trim()) txt=autoSections(txt);
  if(!meta.key) meta.key=guessKey(txt);
  return {text:txt,key:meta.key,capo:meta.capo};
}


/* ===================== Importar cifra (colada ou .txt baixado) ===================== */
const FOOT_RE=/^\s*(composi[çc][aã]o( de)?|colabora[çc][aã]o|esta (informa[çc][aã]o|cifra)|enviar corre|ver mais|exibir|videoaula|adicionar [àa] lista|imprimir|baixar cifra|auto rolagem|cifra club\s*$|letra\s*$|aprenda a tocar|vers[aã]o principal)/i;
function parseCifraText(raw,fileName){
  let lines=String(raw||'').replace(/\r/g,'').replace(/ /g,' ').replace(/\t/g,'    ').split('\n').map(l=>l.replace(/\s+$/,''));
  let title='',artist='',artistUrl='',key='',capo='';
  const isSec=l=>/^\s*\[[^\]]+\]/.test(l)&&!/^\s*\[[^\]]+\]\(/.test(l);
  const tomIdx=lines.findIndex(l=>/^\s*tom\s*:/i.test(l));
  let firstBody=lines.findIndex(l=>isSec(l)||classify(l)==='chord');
  if(tomIdx>=0&&(firstBody<0||tomIdx<firstBody)) firstBody=tomIdx;
  if(firstBody<0) firstBody=0;
  const head=lines.slice(0,firstBody).map(l=>l.trim()).filter(l=>l&&!FOOT_RE.test(l)&&!/^(afina[çc][aã]o|capotraste)/i.test(l));
  for(const l of lines.slice(0,firstBody)){ const c=l.match(/capotraste.*?(\d+)/i); if(c) capo=c[1]+'ª casa'; }
  const md=head.findIndex(l=>/^\[(.+?)\]\((https?:[^)]+)\)$/.test(l));
  if(md>=0){ const m=head[md].match(/^\[(.+?)\]\((https?:[^)]+)\)$/); artist=m[1]; artistUrl=m[2]; title=head[md-1]||''; }
  else if(head.length>=2){ title=head[head.length-2]; artist=head[head.length-1]; }
  else if(head.length===1){ const p=head[0].split(/\s+-\s+/); if(p.length>=2){ artist=p[0]; title=p.slice(1).join(' - '); } else title=head[0]; }
  if(!title&&fileName){ const p=fileName.replace(/\.[^.]+$/,'').split(/\s+-\s+/); if(p.length>=2){ artist=p[0]; title=p.slice(1).join(' - '); } else title=p[0]; }
  let body=lines.slice(firstBody);
  const tl=body.find(l=>/^\s*tom\s*:/i.test(l)); if(tl){ const m=tl.match(/tom\s*:\s*([A-G][#b]?m?)/i); if(m) key=m[1].charAt(0).toUpperCase()+m[1].slice(1); }
  const cut=body.findIndex((l,i)=>i>3&&FOOT_RE.test(l)); if(cut>0) body=body.slice(0,cut);
  const o=organize(body.join('\n'));
  if(!key) key=o.key||'';
  return {title:title.trim(),artist:artist.trim(),artistUrl,key,capo,text:o.text};
}
/* cifra -> grade: um quadro por acorde; acordes muito próximos na mesma linha dividem o quadro */
function chordLineCells(l){
  const toks=[]; const re=/\S+/g; let m;
  while((m=re.exec(l))){ const c=coreOf(m[0])[2]; if(c&&isChord(c)) toks.push({c,x:m.index,end:m.index+m[0].length}); }
  const cells=[]; let cur=null;
  for(const t of toks){ if(cur&&t.x-cur.end<=3&&cur.c.length<3) { cur.c.push(t.c); cur.end=t.end; } else { cur={c:[t.c],end:t.end}; cells.push(cur); } }
  return cells.map(x=>x.c);
}
function cifraToGrid(text){
  const out=[]; const seen={};
  for(const s of sections(text)){
    let cells=[]; for(const l of s.lines){ if(l.t==='chord') cells.push(...chordLineCells(l.s)); }
    if(!cells.length) continue;
    let rep=1; const sig=x=>x.map(c=>c.join(' ')).join('|');
    while(cells.length>=4&&cells.length%2===0&&sig(cells.slice(0,cells.length/2))===sig(cells.slice(cells.length/2))){ cells=cells.slice(0,cells.length/2); rep*=2; }
    const name=s.name||'Parte'; const k=norm(name)+'#'+sig(cells);
    if(seen[k]){ out.push(`[${name} ↺]`,'| % |',''); continue; }
    seen[k]=1;
    out.push(`[${name}${rep>1?' '+rep+'×':''}]`);
    for(let i=0;i<cells.length;i+=4) out.push('| '+cells.slice(i,i+4).map(c=>c.join(' ')).join(' | ')+' |');
    out.push('');
  }
  return out.join('\n').trim();
}
/* lista colada (texto da página de lista do Cifra Club ou do Notes) */
function parseListText(raw){
  const lines=String(raw||'').replace(/\r/g,'').replace(/ /g,' ').split('\n').map(l=>l.replace(/📍/g,'').trim()).filter(Boolean)
    .filter(l=>!/^(\d+\s*(m[uú]sicas?)?|repert[oó]rio|editar|compartilhar|tocar|ordenar|remover|adicionar.*|cifra club|lista.*|meus repert[oó]rios|\d+:\d+)$/i.test(l));
  const items=[]; let pending=null;
  const keyOnly=/^\(?\[?(?:tom:?\s*)?([A-G][#b]?m?)\]?\)?$/i;
  for(const l0 of lines){
    let l=l0.replace(/\s*[\[(]\s*[\])]\s*$/,'').trim();
    const km=l.match(keyOnly); if(km&&items.length){ items[items.length-1].key=km[1]; continue; }
    let key=''; const tk=l.match(/[\[(]\s*([A-G][#b]?m?)\s*[\])]\s*$/)||l.match(/(?:->|→|>)\s*([A-G][#b]?m?)\s*$/); if(tk){ key=tk[1]; l=l.slice(0,tk.index).trim(); }
    l=l.replace(/\s*(->|→|>)\s*$/,'').replace(/^\d+[\s.)-]+/,'').trim(); const cp=l.match(/^([^:]{2,40}):\s+(.+)$/); if(cp&&cp[1].split(/\s+/).length<=5) l=cp[2].trim();
    if(!l) continue;
    let title=l, artist='';
    const p=l.match(/^(.+?)\s*\(([^)]+)\)\s*$/); if(p){ title=p[1]; artist=p[2]; }
    else { const d=l.split(/\s+[-–]\s+/); if(d.length===2){ title=d[0]; artist=d[1]; } }
    const known=typeof findSongByTitle==='function'&&findSongByTitle(title);
    if(!artist&&!key&&pending&&!known){ pending.artist=title; pending=null; continue; }
    const it={title:title.trim(),artist:artist.trim(),key}; items.push(it);
    pending=(!artist&&!key)?it:null;
  }
  return items;
}
/* salvar música importada no acervo */
function upsertImported(p,extra){
  const ex=findSongByTitle(p.title);
  const grid=cifraToGrid(p.text);
  if(ex){
    ex.cifra=p.text; ex.cifraKey=p.key||ex.key;
    if(!ex.grid||ex.gridSource==='cifra'){ ex.grid=grid; ex.gridKey=p.key||ex.key; ex.gridSource='cifra'; }
    if(!ex.artist&&p.artist) ex.artist=p.artist; if(!ex.key&&p.key) ex.key=p.key; if(p.capo&&!ex.capo) ex.capo=p.capo;
    Object.assign(ex,extra||{}); return {s:ex,existed:true};
  }
  const s={...blankSong(),title:p.title||'Sem título',artist:p.artist,key:p.key,capo:p.capo,cifra:p.text,cifraKey:p.key,grid,gridKey:p.key,gridSource:'cifra',...(extra||{})};
  db.songs.push(s); return {s,existed:false};
}

/* ===================== Calendário litúrgico do ano ===================== */
const PRECEITO=new Set(['01-01','12-08','12-25']);
function yearCalendar(Y){
  const out=[]; let d=dUTC(Y,1,1);
  while(d.getUTCFullYear()===Y){
    const iso=isoOf(d), L=litInfo(iso), md=iso.slice(5);
    const corpus=L.titulo&&L.titulo.startsWith('Santíssimo Corpo');
    const fixa=!!FIXAS[md];
    const special=(L.titulo&&!/Domingo do Tempo Comum|Domingo da Páscoa$|Domingo do Advento|Domingo da Quaresma|Domingo do Tempo do Natal|feira Santa$/.test(L.titulo)&&L.dow!==0)
      ||(L.dow===0&&L.titulo&&!/\d+º Domingo/.test(L.titulo))||fixa||/1º Domingo do Advento/.test(L.titulo||'');
    if(special){ out.push({iso,L,title:fixa?FIXAS[md]:L.titulo,prec:PRECEITO.has(md)||corpus}); }
    d=addD(d,1);
  }
  return out;
}
function calHtml(Y){
  const list=yearCalendar(Y); const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const byM={}; list.forEach(x=>{ const m=+x.iso.slice(5,7)-1; (byM[m]=byM[m]||[]).push(x); });
  return `<div class="calhead"><button data-act="calYear" data-d="-1">‹</button><b class="serif">${Y}</b><button data-act="calYear" data-d="1">›</button>
      <span class="hint">★ dia de preceito (além de todos os domingos). Confira as transferências da sua diocese.</span></div>
    <div class="cal">${MESES.map((mn,i)=>byM[i]?`<div class="calm"><div class="sub">${mn}</div>${byM[i].map(x=>`<button class="calrow ${x.iso===today()?'hoje':''}" data-act="litPick" data-d="${x.iso}"><i class="sw" style="background:${COR[x.L.cor]}"></i><b>${x.iso.slice(8)}</b><span>${esc(x.title)}</span>${x.prec?'<em title="Dia de preceito">★</em>':''}</button>`).join('')}</div>`:'').join('')}</div>`;
}

/* ===================== Roteiro (grade com anotações, estilo Notes) ===================== */
function parseRoteiro(raw){
  const lines=String(raw||'').replace(/\r/g,'').replace(/ /g,' ').split('\n').map(l=>l.replace(/\s+$/,''));
  let title='',artist='',key=''; const out=[]; let started=false;
  const isCh=l=>l.trim()&&(isChordLine(l)||isBarLine(l));
  const nextNonEmpty=i=>{ for(let j=i+1;j<lines.length;j++) if(lines[j].trim()) return lines[j]; return ''; };
  for(let i=0;i<lines.length;i++){
    const l=lines[i]; const t=l.trim(); if(!t) continue;
    const tm=t.match(/^tom\s*:\s*([A-G][#b]?m?)/i); if(tm){ key=tm[1].charAt(0).toUpperCase()+tm[1].slice(1); continue; }
    if(!started&&!title&&!isCh(l)&&!/^tom/i.test(nextNonEmpty(i))&&/\s[-–]\s/.test(t)){ const p=t.split(/\s+[-–]\s+/); title=p[0]; artist=(p[1]||'').replace(/\s*\(.*\)\s*$/,''); continue; }
    if(!started&&!title&&!isCh(l)&&/^tom/i.test(nextNonEmpty(i))){ const p=t.split(/\s+[-–]\s+/); title=p[0]; artist=(p[1]||'').replace(/\s*\(.*\)\s*$/,''); continue; }
    if(isCh(l)){ started=true; out.push(l.includes('|')?l.trim():l.trim()); continue; }
    started=true;
    if(isCh(nextNonEmpty(i))&&t.length<60) out.push('','['+t.replace(/^\[|\]$/g,'')+']');
    else out.push(t);
  }
  const grid=out.join('\n').replace(/^\n+/,'');
  if(!key){ const g=sections(grid); for(const s of g){ const c=gridCells(s)[0]; if(c){ const p=splitChord(c[0]); if(p){ key=p.root+(/^m(?!aj)/.test(p.q)?'m':''); break; } } } }
  return {title,artist,key,grid};
}

/* ===================== Cifra: acordes tocáveis + inversões ===================== */
function rawSections(text){
  const lines=String(text||'').split('\n'); const secs=[]; let cur=null;
  lines.forEach((l,i)=>{ const h=l.match(/^\s*\[([^\]]+)\]\s*$/); if(h){ cur={name:h[1].trim(),idx:[]}; secs.push(cur); return; } if(!cur){ cur={name:'',idx:[]}; secs.push(cur); } cur.idx.push(i); });
  secs.forEach(s=>{ while(s.idx.length&&!lines[s.idx[0]].trim()) s.idx.shift(); while(s.idx.length&&!lines[s.idx[s.idx.length-1]].trim()) s.idx.pop(); });
  return {lines,secs:secs.filter(s=>s.idx.length||s.name)};
}
function lineChords(l){ const out=[]; const re=/\S+/g; let m; while((m=re.exec(l))){ const c=coreOf(m[0])[2]; if(c&&isChord(c)) out.push(c); } return out; }
function cifraSecChords(text,si){ const {lines,secs}=rawSections(text); const s=secs[si]; if(!s) return []; const out=[]; s.idx.forEach(i=>{ if(classify(lines[i])==='chord') out.push(...lineChords(lines[i])); }); return out; }
function setCifraSecChords(text,si,newChords){
  const {lines,secs}=rawSections(text); const s=secs[si]; if(!s) return text; const q=newChords.slice();
  s.idx.forEach(i=>{ if(classify(lines[i])==='chord') lines[i]=rebuildChordLine(lines[i],q); });
  return lines.join('\n');
}
function chordLineHtml(l,fn,si,li,sugMap,startK){
  let out='',len=0,ti=0; const re=/\S+/g; let m;
  while((m=re.exec(l))){
    const p=m.index; if(len<p){ out+=' '.repeat(p-len); len=p; } else if(len>0){ out+=' '; len++; }
    const t=m[0], c=coreOf(t); let txt,html;
    if(c[2]&&isChord(c[2])){ const k=startK+ti; const sug=sugMap&&sugMap[k]; const shown=fn(sug?sug.c:c[2]);
      txt=c[1]+shown+c[3]; html=esc(c[1])+`<b class="ch${sug&&sug.s?' sug':''}" data-act="chordEdit" data-si="${si}" data-li="${li}" data-ti="${ti}">${esc(shown)}</b>`+esc(c[3]); ti++; }
    else { txt=t; html='<span class="nz">'+esc(t)+'</span>'; }
    out+=html; len+=txt.length;
  }
  return {html:out,n:ti};
}
function cifraHtml(s,targetKey){
  const ck=parseKey(s.cifraKey||s.key), tk=parseKey(targetKey)||ck; const semi=ck&&tk?(tk.root-ck.root+12)%12:0; const flats=tk?FLAT_KEYS.has(tk.name):false;
  const fn=c=>transposeChord(c,semi,flats); const secs=sections(s.cifra);
  return secs.map((sec,si)=>{ const nm=norm(sec.name);
    let sugMap=null, hasSug=false;
    if(invOn(sec.name,secs)){ const flat=[]; sec.lines.forEach(l=>{ if(l.t==='chord') flat.push(...lineChords(l.s)); });
      if(flat.length>1){ const sg=suggestInversions(flat,ck?FLAT_KEYS.has(ck.name):false,ck?ck.root:null); sugMap=sg.map((c,i)=>({c,s:c!==flat[i]})); hasSug=sugMap.some(x=>x.s); } }
    let k=0;
    const body=sec.lines.map((l,li)=>{ if(l.t==='chord'){ const r=chordLineHtml(l.s,fn,si,li,sugMap,k); k+=r.n; return r.html; } return l.t==='blank'?'':l.t==='tab'?`<span class="tabl">${esc(l.s)}</span>`:`<span class="lyr">${esc(l.s)}</span>`; }).join('\n');
    return `<section class="csec ${nm.includes('refr')||nm.includes('coro')?'refrao':''}"><div class="gname"><span>${esc(sec.name||'')}</span>${hasSug?`<button class="mini" data-act="applyInvC" data-si="${si}">Aplicar inversões</button>`:''}</div><pre>${body}</pre></section>`; }).join('');
}
function chordEditor(si,li,ti){
  const c=songCtx(); const s=c.s; const ck=parseKey(s.cifraKey||s.key), tk=parseKey(c.key)||ck; const semi=ck&&tk?(tk.root-ck.root+12)%12:0; const flats=tk?FLAT_KEYS.has(tk.name):false;
  const sec=sections(s.cifra)[si]; const l=sec&&sec.lines[li]; if(!l) return; const ch=lineChords(l.s)[ti]; if(!ch) return;
  const disp=transposeChord(ch,semi,flats); const base=disp.replace(/\/[A-G][#b]?$/,''); const t=chordTones(base);
  // acorde anterior na parte (para pedal)
  let prev=null; const all=[]; sec.lines.forEach((x,i)=>{ if(x.t==='chord') lineChords(x.s).forEach((cc,j)=>all.push({cc,i,j})); });
  const pos=all.findIndex(x=>x.i===li&&x.j===ti); if(pos>0){ const p=splitChord(transposeChord(all[pos-1].cc,semi,flats)); prev=p&&(p.bass||p.root); }
  const names=['Fundamental','3ª','5ª','7ª'];
  const o=t?t.opts.map((x,k)=>({v:x.iv===0?base:base+'/'+noteName(t.r+x.iv,flats),l:names[k]})):[];
  if(t&&prev&&prev!==t.p.root&&!o.some(x=>x.v.endsWith('/'+prev))) o.push({v:base+'/'+prev,l:'Pedal '+prev});
  S.modal={t:'chord',si,li,ti,secName:sec.name,cur:disp,opts:o}; render();
}

function chordSave(){
  const M=S.modal; const c=songCtx(); const s=c.s; const ck=parseKey(s.cifraKey||s.key), tk=parseKey(c.key)||ck; const semi=ck&&tk?(tk.root-ck.root+12)%12:0;

function applyInvC(si){

/* link do Cifra Club -> música */
function titleCase(slug){ const small=new Set(['de','da','do','das','dos','e','a','o','em','no','na','com','pra','para','por']); return slug.split('-').filter(Boolean).map((w,i)=>i&&small.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }
function parseCifraLink(text){
  const m=String(text||'').match(/https?:\/\/(?:www\.|m\.)?cifraclub\.com\.br\/([a-z0-9-]+)\/([a-z0-9-]+)\/?[^\s]*/i); if(!m) return null;
  const link=`https://www.cifraclub.com.br/${m[1]}/${m[2]}/`;
  const same=db.songs.find(s=>s.link&&s.link.includes('/'+m[1]+'/')&&s.artist);
  let title=titleCase(m[2]), artist=same?same.artist:titleCase(m[1]);
  // texto compartilhado pelo app: "Título - Artista - Cifra Club"
  const t=String(text).replace(m[0],'').replace(/cifra club/ig,'').trim();
  const p=t.split(/\s+[-–|]\s+/).map(x=>x.trim()).filter(Boolean);
  if(p[0]&&p[0].length<80) title=p[0].replace(/^Cifra( de)?\s+/i,'');
  if(p[1]&&p[1].length<60) artist=p[1];
  return {link,title,artist};
}
function cifraSearchUrl(q){ return 'https://www.google.com/search?q='+encodeURIComponent('cifra club '+q); }

/* busca */
function searchSongs(q,limit=40){
  const words=norm(q).trim().split(/\s+/).filter(Boolean); if(!words.length) return [];
  const res=[];
  for(const s of db.songs){
    const t=norm(s.title), hay=t+' '+norm(s.artist)+' '+norm(s.trecho)+' '+norm((s.momentos||[]).join(' '))+' '+norm(s.festa);
    if(!words.every(w=>hay.includes(w))) continue;
    const sc=t.startsWith(words.join(' '))?0:t.includes(words[0])?1:2;
    res.push({s,sc});
  }
  res.sort((a,b)=>a.sc-b.sc||a.s.title.localeCompare(b.s.title,'pt'));
  return res.slice(0,limit).map(r=>r.s);
}

function songCtx(){
  const s=songById(S.songId); if(!s) return null;
  let ev=null,f=null,key=s.key;
  if(S.ctx!=null){ ev=evById(S.evId); f=ev&&flatItems(ev)[S.ctx]; if(f&&f.it.songId===s.id) key=itemKey(f.it,s); else f=null; }
  return {s,ev,f,key};
}
function gridSemi(s,targetKey){ const gk=parseKey(s.gridKey||s.key), tk=parseKey(targetKey)||gk; return {semi:gk&&tk?(tk.root-gk.root+12)%12:0, flats:tk?FLAT_KEYS.has(tk.name):false, gk, tk}; }
function gridHtml(s,targetKey){
  const {semi,flats,gk}=gridSemi(s,targetKey); const allSecs=sections(s.grid);
  return allSecs.map((sec,i)=>{ const cells=gridCells(sec); const nm=norm(sec.name);
    if(/↺\s*$/.test(sec.name)) return `<div class="gref">↺ ${esc(sec.name.replace(/\s*↺\s*$/,''))} (repete)</div>`;
    const isRef=nm.includes('refr')||nm.includes('coro');
    let sug=null, hasSug=false;
    if(invOn(sec.name)&&cells.flat().filter(c=>c!=='%').length>1){
      const flat=[]; cells.forEach(cs=>cs.forEach(c=>{ if(c!=='%') flat.push(c); }));
      const sg=suggestInversions(flat,gk?FLAT_KEYS.has(gk.name):false,gk?gk.root:null); let k=0;
      sug=cells.map(cs=>cs.map(c=>{ if(c==='%') return {c,s:false}; const r={c:sg[k],s:sg[k]!==flat[k]}; k++; if(r.s) hasSug=true; return r; }));
    }
    const cellHtml=(cs,ci)=>{ const fig=(s.bassFig||{})[i+':'+ci];
      return `<div class="cell ${cs.length>=3?'c3':cs.length===2?'c2':''}" data-act="cellEdit" data-si="${i}" data-ci="${ci}"><div class="cr">${cs.map((c,cj)=>{ const x=sug?sug[ci][cj]:{c,s:false}; return gridChordHtml(x.c==='%'?x.c:transposeChord(x.c,semi,flats),x.s); }).join('')}</div>${fig?`<span class="bfig">${esc(transposeNotes(fig,semi,flats))}</span>`:''}</div>`; };
    let html='', row=[], ci=0;
    const flush=()=>{ if(row.length){ html+=`<div class="grid">${row.join('')}</div>`; row=[]; } };
    for(const l of sec.lines){
      if(l.t==='chord'){ const p=l.s.includes('|')?parseBarLine(l.s):{cells:lineChords(l.s).map(c=>[c]),note:''};
        for(const cs of p.cells){ row.push(cellHtml(cs,ci)); ci++; }
        if(p.note){ flush(); html+=`<div class="gnote">${esc(p.note)}</div>`; } }
      else if(l.t==='lyric'){ flush(); html+=`<div class="gnote">${esc(l.s.trim())}</div>`; }
    }
    flush();
    return `<section class="gsec ${isRef?'refrao':''}"><div class="gname"><span>${esc(sec.name||'')}</span>${hasSug?`<button class="mini" data-act="applyInv" data-si="${i}">Aplicar inversões</button>`:''}</div>${html}</section>`; }).join('');
}

/* editor de compasso (inversão + figura de baixo) */
function cellEditor(si,ci){
  const c=songCtx(); const s=c.s; const {semi,flats,gk}=gridSemi(s,c.key);
  const sec=sections(s.grid)[si]; if(!sec) return; const cells=gridCells(sec); const cs=cells[ci]; if(!cs) return;
  if(cs.every(x=>x==='%')){ toast('Compasso de repetição'); return; }
  const disp=cs.map(x=>x==='%'?x:transposeChord(x,semi,flats));
  let prevBass=null; for(let k=ci-1;k>=0&&!prevBass;k--){ const pc=cells[k].filter(x=>x!=='%'); if(pc.length){ const p=splitChord(transposeChord(pc[pc.length-1],semi,flats)); prevBass=p&&(p.bass||p.root); } }
  const names=['Fundamental','3ª','5ª','7ª'];
  const rows=disp.map((dc,j)=>{ if(dc==='%') return null; const base=dc.replace(/\/[A-G][#b]?$/,''); const t=chordTones(base); if(!t) return null;
    const pb=j>0?(()=>{ const p=splitChord(disp[j-1]); return p&&(p.bass||p.root); })():prevBass;
    const o=t.opts.map((x,k)=>({v:x.iv===0?base:base+'/'+noteName(t.r+x.iv,flats),l:names[k]}));
    if(pb&&pb!==t.p.root&&!o.some(x=>x.v.endsWith('/'+pb))) o.push({v:base+'/'+pb,l:'Pedal '+pb});
    return {j,base,o}; }).filter(Boolean);
  const first=disp.find(x=>x!=='%'); const fp=first&&splitChord(first); const figs=[];
  if(fp){ const r=fp.bass||fp.root, R=IDX[r], nn=x=>noteName(R+x,flats);
    figs.push({v:nn(9)+'→'+r,l:'Bordadura pela 6ª'},{v:nn(7)+'→'+r,l:'5ª e volta'},{v:r+'→'+nn(7),l:'Fundamental e 5ª'},{v:r+'→'+r+"'",l:'Oitava'});
    let nx=null; for(let k=ci+1;k<cells.length&&!nx;k++){ const c2=cells[k].find(x=>x!=='%'); if(c2){ const p2=splitChord(transposeChord(c2,semi,flats)); nx=p2&&(p2.bass||p2.root); } }
    if(nx&&nx!==r){ const N=IDX[nx]; figs.push({v:r+'→'+noteName(N-1,flats)+'→'+nx,l:'Cromático p/ próximo'},{v:r+'→'+noteName(N+1,flats)+'→'+nx,l:'Aproximação por cima'}); } }
  const fig=transposeNotes((s.bassFig||{})[si+':'+ci]||'',semi,flats);
  S.modal={t:'cell',si,ci,secName:sec.name,cur:disp.join(' '),rows,figs,fig}; render();
}

function cellSave(){
  const M=S.modal; const c=songCtx(); const s=c.s; const {semi,gk}=gridSemi(s,c.key);
  const val=(document.getElementById('cellIn')?.value||'').trim(); const toks=val.split(/\s+/).filter(Boolean);
  if(!toks.length||!toks.every(t=>t==='%'||isChord(t))){ toast('Não reconheci algum acorde'); return; }
  const back=(12-semi)%12, of=gk?FLAT_KEYS.has(gk.name):false;
  const orig=toks.map(t=>t==='%'?t:transposeChord(t,back,of));
  s.grid=replaceCell(s.grid,M.si,M.ci,orig);
  const figv=(document.getElementById('figIn')?.value||'').trim(); s.bassFig=s.bassFig||{};
  if(figv) s.bassFig[M.si+':'+M.ci]=transposeNotes(figv,back,of); else delete s.bassFig[M.si+':'+M.ci];
  learnBass(orig.filter(t=>t!=='%'),gk?gk.root:0); save(); S.modal=null; rerender(); toast('Compasso salvo');
}
function applyInv(si){
  const s=songById(S.songId); const sec=sections(s.grid)[si]; if(!sec) return; const gk=parseKey(s.gridKey||s.key);
  const flat=[]; gridCells(sec).forEach(cs=>cs.forEach(c=>{ if(c!=='%') flat.push(c); }));
  const sg=suggestInversions(flat,gk?FLAT_KEYS.has(gk.name):false,gk?gk.root:null);
  s.grid=applySectionChords(s.grid,si,sg); learnBass(sg,gk?gk.root:0); save(); rerender(); toast('Inversões gravadas em “'+(sec.name||'parte')+'”');
}
